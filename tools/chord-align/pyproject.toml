[project]
name = "chord-align"
version = "0.1.0"
description = "Align a chord chart's known chords to a recording: lengths in beats, tempo and key."
requires-python = ">=3.11"
dependencies = ["librosa", "numpy", "scipy", "soundfile"]

[project.scripts]
chord-align = "chord_align.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chord_align"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "PTH", "T20", "RUF", "SIM"]
# Docstrings say what a thing is, as the rest of the repo does; music text uses × − and ♯.
ignore = ["D203", "D213", "D105", "D107", "D401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"chord_align/cli.py" = ["T20"]
"chord_align/__main__.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: renders and aligns synthesised audio"]
