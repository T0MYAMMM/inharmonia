name: Format floating Falling Notes integration (temporary)
on:
  push:
    branches: [feature/falling-notes-score]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier changed files
        run: npx prettier --write src/features/song/FallingNotes.tsx src/features/song/FallingNotes.module.css src/features/song/Score.tsx src/features/song/LessonPlayer.tsx src/features/song/Score.test.tsx src/ui/keyboard/Keyboard.module.css src/ui/keyboard/KeyboardDock.tsx src/ui/keyboard/KeyboardDock.module.css e2e/song.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "inharmonia-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/song/FallingNotes.tsx src/features/song/FallingNotes.module.css src/features/song/Score.tsx src/features/song/LessonPlayer.tsx src/features/song/Score.test.tsx src/ui/keyboard/Keyboard.module.css src/ui/keyboard/KeyboardDock.tsx src/ui/keyboard/KeyboardDock.module.css e2e/song.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier for floating Falling Notes"
            git push origin HEAD:feature/falling-notes-score
          fi
