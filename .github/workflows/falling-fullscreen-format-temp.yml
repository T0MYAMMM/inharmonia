name: Format falling notes fullscreen (temporary)
on:
  push:
    branches: [feature/falling-notes-score]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format fullscreen changes
        run: npx prettier --write src/ui/keyboard/KeyboardDock.tsx src/ui/keyboard/KeyboardDock.module.css src/features/song/LessonPlayer.tsx e2e/song.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "inharmonia-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/keyboard/KeyboardDock.tsx src/ui/keyboard/KeyboardDock.module.css src/features/song/LessonPlayer.tsx e2e/song.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to Falling Notes fullscreen"
            git push origin HEAD:feature/falling-notes-score
          fi
