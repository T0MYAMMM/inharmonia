name: Regenerate expanded song library (temporary)
on:
  push:
    branches: [feature/extend-classical-song-scores]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  songs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run songs
      - run: npm run songs -- --check
      - name: Commit deterministic song JSON
        run: |
          git config user.name "inharmonia-song-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/songs/canon-in-d.json src/content/songs/brahms-lullaby.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate longer Canon in D and Brahms Lullaby arrangements"
            git push origin HEAD:feature/extend-classical-song-scores
          fi
