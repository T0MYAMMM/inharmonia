name: Format Falling Notes (temporary)
on:
  push:
    branches: [feature/falling-notes-score]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/song/FallingNotes.tsx src/features/song/fallingNotesLayout.ts src/features/song/LessonPlayer.tsx
      - name: Commit formatting
        run: |
          git config user.name "inharmonia-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/song/FallingNotes.tsx src/features/song/fallingNotesLayout.ts src/features/song/LessonPlayer.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to Falling Notes feature"
            git push origin HEAD:feature/falling-notes-score
          fi
