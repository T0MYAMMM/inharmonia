name: chord-align

# The offline chord alignment tool in tools/chord-align. It is not part of the
# web build, so it runs only when the tool changes.
on:
  push:
    branches: [main]
    paths:
      - 'tools/chord-align/**'
      - '.github/workflows/chord-align.yml'
  pull_request:
    paths:
      - 'tools/chord-align/**'
      - '.github/workflows/chord-align.yml'

concurrency:
  group: chord-align-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chord-align:
    name: Ruff, pytest, check-output
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chord-align
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/chord-align/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
        working-directory: .
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -v
        env:
          CHORD_ALIGN_REQUIRE_NODE: '1'
      - name: Align every render, then import each output with the app's reader
        run: |
          python -m chord_align eval --write "$RUNNER_TEMP/aligned"
          cd ../..
          npx tsx --tsconfig tsconfig.app.json tools/chord-align/check-output.ts "$RUNNER_TEMP"/aligned/*.json
