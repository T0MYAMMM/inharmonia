name: Temporary Prettier diff
on:
  push:
    branches:
      - feature/song-arrangement-controls
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Show Prettier diff for arrangement module
        run: |
          npx prettier src/core/content/songArrangement.ts > /tmp/songArrangement.formatted.ts
          diff -u src/core/content/songArrangement.ts /tmp/songArrangement.formatted.ts || true
