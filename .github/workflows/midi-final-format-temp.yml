name: Format MIDI final changes (temporary)
on:
  push:
    branches: [feature/studio-midi-import-export-editor]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/studio/MidiRoll.tsx src/core/midi/adapters.ts
      - name: Commit formatting
        run: |
          git config user.name "inharmonia-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/studio/MidiRoll.tsx src/core/midi/adapters.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format MIDI drag editing changes"
            git push origin HEAD:feature/studio-midi-import-export-editor
          fi
